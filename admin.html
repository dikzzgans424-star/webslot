<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin — Miwa Gacha</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0c0c0e; --card:#16161d; --line:rgba(255,255,255,.08); --gold:#d4af5a; --gl:#f0d080; --tx:#f0ede8; --mu:#7a776f; --g:#4caf82; --r:#cf5c5c; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--tx); font-family: 'Syne', sans-serif; padding: 16px; max-width: 760px; margin: 0 auto; }
    h1 { font-family: 'Cinzel', serif; font-size: 22px; color: var(--gl); letter-spacing: 3px; margin: 8px 0 2px; }
    .sub { color: var(--mu); font-size: 12px; margin-bottom: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
    .lbl { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--mu); font-weight: 700; margin-bottom: 10px; display: block; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .stat span { display: block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mu); margin-bottom: 4px; }
    .stat strong { font-size: 18px; }
    .pos { color: var(--g); } .neg { color: var(--r); }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th { font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--mu); text-align: right; padding-bottom: 8px; }
    td { text-align: right; padding: 8px 0; border-top: 1px solid var(--line); color: #b9b5ac; }
    th:first-child, td:first-child { text-align: left; color: var(--tx); }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--mu); font: 700 12px 'Syne'; cursor: pointer; }
    .tab.on { color: #0c0c0e; background: linear-gradient(135deg, var(--gl), var(--gold)); border-color: transparent; }
    .msg { text-align: center; color: var(--mu); padding: 30px 0; }
    .msg.err { color: var(--r); }
    .warn { font-size: 11px; color: var(--mu); margin-top: 6px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--tx); font: 700 11px 'Syne'; cursor: pointer; }
  </style>
</head>
<body>
  <div class="row"><div><h1>MIWA ADMIN</h1><div class="sub" id="sub">Memuat…</div></div><button class="btn" id="refresh">↻ Refresh</button></div>
  <div id="out"><div class="msg">Memuat data…</div></div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const fmt = n => Number(n || 0).toLocaleString('id-ID');
  const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
  const cls = n => n > 0 ? 'pos' : n < 0 ? 'neg' : '';
  const LABELS = { reelsgird:'🎰 Reels', roulette:'🎡 Roulette', coinflip:'🪙 Coinflip', horserace:'🐎 Horse Race', airplane:'✈️ Airplane', blackjack:'🃏 Blackjack', plinko:'🔴 Plinko', mines:'💣 Mines', wheel:'🎯 Wheel', hilo:'🔮 Hi-Lo' };

  /* Ambil password dari ?pass=, simpan di sessionStorage, lalu hapus dari URL
     supaya tidak tertinggal di riwayat/screenshot. */
  let pass = '';
  try {
    const q = new URLSearchParams(location.search).get('pass');
    if (q) { sessionStorage.setItem('miwa_admin', q); history.replaceState(null, '', location.pathname); }
    pass = sessionStorage.getItem('miwa_admin') || '';
  } catch (e) {}

  let data = null, mode = 'today';

  async function load() {
    $('out').innerHTML = '<div class="msg">Memuat data…</div>';
    try {
      const r = await fetch('/api/admin', { headers: { 'x-admin-pass': pass } });
      if (r.status === 401) throw new Error('Password salah / tidak ada. Buka /admin?pass=…');
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Gagal memuat');
      data = d; draw();
    } catch (e) { $('out').innerHTML = '<div class="msg err">❌ ' + e.message + '</div>'; $('sub').textContent = ''; }
  }

  function gameRows(map) {
    const keys = Object.keys(map).sort((a, b) => map[b].plays - map[a].plays);
    if (!keys.length) return '<tr><td colspan="5" style="text-align:center;color:var(--mu)">Belum ada data</td></tr>';
    return keys.map(k => {
      const g = map[k];
      return `<tr><td>${LABELS[k] || k}</td><td>${fmt(g.plays)}</td><td>${fmt(g.wagered)}</td><td class="${g.rtp > 100 ? 'neg' : ''}">${g.rtp == null ? '—' : g.rtp + '%'}</td><td class="${cls(g.houseProfit)}">${sgn(g.houseProfit)}</td></tr>`;
    }).join('');
  }

  function draw() {
    const d = data, s = mode === 'today' ? d.today : d.total, pg = mode === 'today' ? d.perGameToday : d.perGame;
    $('sub').textContent = 'Update ' + new Date(d.generatedAt).toLocaleString('id-ID') + ' · satuan: bet (1 bet = Rp 1.000)';
    const st = (l, v, c) => `<div class="stat"><span>${l}</span><strong class="${c || ''}">${v}</strong></div>`;
    $('out').innerHTML = `
      <div class="tabs"><button class="tab ${mode==='today'?'on':''}" data-m="today">Hari ini (WIB)</button><button class="tab ${mode==='all'?'on':''}" data-m="all">Semua waktu</button></div>
      <div class="card"><span class="lbl">Ringkasan</span><div class="grid">
        ${st('Untung House', sgn(s.houseProfit) + ' bet', cls(s.houseProfit))}
        ${st('RTP (kembali ke pemain)', s.rtp == null ? '—' : s.rtp + '%', s.rtp > 100 ? 'neg' : '')}
        ${st('Total Main', fmt(s.plays))}
        ${st('Total Taruhan', fmt(s.wagered) + ' bet')}
        ${st('Menang / Kalah / Impas', `${fmt(s.wins)} / ${fmt(s.losses)} / ${fmt(s.even)}`)}
        ${st('Token (Premium)', `${fmt(d.tokens.total)} (${fmt(d.tokens.premium)})`)}
      </div><div class="warn">Saldo beredar semua token: ${fmt(d.tokens.balanceSum)} bet. RTP &gt; 100% (merah) = game itu merugikan house.</div></div>
      <div class="card"><span class="lbl">Per Game</span><table><tr><th>Game</th><th>Main</th><th>Taruhan</th><th>RTP</th><th>House</th></tr>${gameRows(pg)}</table></div>
      <div class="card"><span class="lbl">7 Hari Terakhir</span><table><tr><th>Tanggal</th><th>Main</th><th>Taruhan</th><th>RTP</th><th>House</th></tr>
        ${d.perDay.map(x => `<tr><td>${x.date.slice(5)}</td><td>${fmt(x.plays)}</td><td>${fmt(x.wagered)}</td><td>${x.rtp == null ? '—' : x.rtp + '%'}</td><td class="${cls(x.houseProfit)}">${sgn(x.houseProfit)}</td></tr>`).join('')}</table></div>
      <div class="card"><span class="lbl">Top 10 Pemain (net profit)</span><table><tr><th>Token</th><th>Main</th><th>Net</th></tr>
        ${d.topWinners.map(p => `<tr><td>${p.token}${p.premium ? ' ★' : ''}</td><td>${fmt(p.plays)}</td><td class="${cls(p.net)}">${sgn(p.net)}</td></tr>`).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--mu)">Belum ada data</td></tr>'}</table></div>`;
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
  }

  $('refresh').onclick = load;
  load();
})();
</script>
</body>
</html>
