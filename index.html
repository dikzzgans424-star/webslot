<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miwa Gacha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-olympus">

<div class="container">

  <!-- Header -->
  <div class="header-card">
    <div class="logo-wrap">🎰</div>
    <h1>MIWA GACHA</h1>
    <p class="tagline">Premium Slot Experience</p>
  </div>

  <!-- Input / Back-to-dashboard (saling tukar tampil) -->
  <div id="tokenInputSlot">
    <div class="glass-card" id="tokenInputCard">
      <span class="input-label">Masukkan Token</span>
      <form id="tokenForm" autocomplete="on">
        <div class="input-row">
          <div class="input-wrap">
            <input
              id="gachaId"
              name="gachaToken"
              type="text"
              placeholder="TKN-XXXXXXXXXXXX"
              autocomplete="on"
              spellcheck="false">
          </div>
          <button id="spinBtn" type="submit">Cek Token</button>
        </div>
      </form>
    </div>

    <button id="backToDashboardBtn" class="back-dashboard-btn" onclick="backToDashboard()" style="display:none;">
      ← Back to Dashboard
    </button>
  </div>

  <!-- Info card, game area, result → diinject JS -->

  <!-- Status -->
  <div class="status-card">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text-wrap">
      <div class="status-label">Status</div>
      <div id="statusText">Masukkan Token untuk memulai...</div>
    </div>
  </div>

  <div class="footer">
    <span>Miwa &mdash; Premium Casino Engine</span>
  </div>

</div>

<!-- Game modules -->
<script src="games/reelsgird.js"></script>
<script src="games/roulette.js"></script>
<script src="games/coinflip.js"></script>
<script src="games/airplane.js"></script>
<script src="games/horserace.js"></script>
<script src="games/blackjack.js"></script>
<script src="games/plinko.js"></script>
<script src="games/mines.js"></script>
<script src="games/olympus.js"></script>

<!-- Core -->
<script src="app.js"></script>

</body>
</html>
